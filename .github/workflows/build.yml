name: Build RedMagic TGK Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture source
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK pieces
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        id: gradle_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean :app:assembleDebug --stacktrace --info 2>&1 | tee /tmp/tgk-gradle.log

      - name: Publish failure log
        if: steps.gradle_build.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          {
            echo '# RedMagic TGK test CI failure'
            echo "Source commit: $SOURCE_SHA"
            echo
            tail -n 800 /tmp/tgk-gradle.log
          } > docs/TGK_BUILD_FAILURE.log
          git config user.name 'RedMagic TGK CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/TGK_BUILD_FAILURE.log
          git commit -m "ci: record TGK build failure for $SOURCE_SHA" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
          exit 1

      - name: Publish verified APK
        if: steps.gradle_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=dist/RedMagic-TGK-Test-debug.apk
          test -s "$APK"
          mkdir -p dist docs
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          rm -f docs/TGK_BUILD_FAILURE.log
          git config user.name 'RedMagic TGK CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT" "$OUT.sha256"
          git add -u docs/TGK_BUILD_FAILURE.log || true
          git commit -m "build: publish RedMagic TGK test APK from $SOURCE_SHA" || true
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Upload APK artifact
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RedMagic-TGK-Test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
